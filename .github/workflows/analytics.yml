name: Категорийная аналитика

# Запускается тремя способами:
#   1) автоматически — когда вы загрузили файл в папку 1_ВХОД
#   2) вручную — вкладка Actions -> Категорийная аналитика -> Run workflow
#   3) по расписанию — каждый будний день в 07:00 МСК (если файлы лежат в 1_ВХОД)
on:
  push:
    paths:
      - '1_ВХОД/**'
      - 'config/**'
      - 'engine/**'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  считать:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Поставить библиотеки
        run: pip install -r requirements.txt

      - name: Проверить, есть ли что считать
        id: проверка
        run: |
          if ls 1_ВХОД/*.xlsb 1_ВХОД/*.xlsx 1_ВХОД/*.xlsm >/dev/null 2>&1; then
            echo "есть=да" >> $GITHUB_OUTPUT
          else
            echo "есть=нет" >> $GITHUB_OUTPUT
            echo "::notice::В папке 1_ВХОД нет файлов — считать нечего."
          fi

      - name: Посчитать и собрать отчёты
        if: steps.проверка.outputs.есть == 'да'
        run: python engine/run.py

      - name: Показать итог в сводке запуска
        if: steps.проверка.outputs.есть == 'да'
        run: |
          ПАПКА=$(ls -td 3_ОТЧЁТЫ/*/ | head -1)
          echo "## Расчёт выполнен" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 "${ПАПКА}журнал.txt" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Отчёты: \`${ПАПКА}\`" >> $GITHUB_STEP_SUMMARY

      - name: Сохранить отчёты в репозиторий
        if: steps.проверка.outputs.есть == 'да'
        run: |
          git config user.name  "Категорийная аналитика"
          git config user.email "actions@github.com"
          git add 3_ОТЧЁТЫ docs база
          git add -A 1_ВХОД
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Отчёты за $(date +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Приложить обработанные исходники к запуску
        if: steps.проверка.outputs.есть == 'да'
        uses: actions/upload-artifact@v4
        with:
          name: Исходники-обработанные
          path: 2_АРХИВ/
          retention-days: 90
          if-no-files-found: ignore

      - name: Приложить отчёты к запуску
        if: steps.проверка.outputs.есть == 'да'
        uses: actions/upload-artifact@v4
        with:
          name: Отчёты
          path: 3_ОТЧЁТЫ/
          retention-days: 90

      - name: Подготовить публикацию дашборда
        if: steps.проверка.outputs.есть == 'да'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  опубликовать:
    needs: считать
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Опубликовать дашборд
        id: pages
        uses: actions/deploy-pages@v4
        continue-on-error: true
