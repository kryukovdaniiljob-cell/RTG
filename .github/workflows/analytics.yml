name: Категорийная аналитика

# Запускается тремя способами:
#   1) автоматически — когда вы загрузили файл в папку 1_ВХОД
#   2) вручную — вкладка Actions -> Категорийная аналитика -> Run workflow
#   3) по расписанию — каждый будний день в 07:00 МСК (если файлы лежат в 1_ВХОД)
#
# ВАЖНО: идентификаторы job и step (jobs.<id>, steps.<id>) должны быть
# латиницей — GitHub Actions не принимает кириллицу в идентификаторах.
# Отображаемые названия (name:) кириллицей можно.
on:
  push:
    paths:
      - '1_ВХОД/**'
      - 'config/**'
      - 'engine/**'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1-5'

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  analytics:
    name: Расчёт и сборка отчётов
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Поставить библиотеки
        run: pip install -r requirements.txt

      - name: Проверить, есть ли что считать
        id: check
        run: |
          shopt -s nullglob
          files=(1_ВХОД/*.xlsb 1_ВХОД/*.xlsx 1_ВХОД/*.xlsm)
          if [ ${#files[@]} -gt 0 ]; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
            echo "Найдено файлов: ${#files[@]}"
          else
            echo "found=no" >> "$GITHUB_OUTPUT"
            echo "::notice::В папке 1_ВХОД нет выгрузок — считать нечего. Загрузите файлы и запуск пойдёт сам."
          fi

      - name: Посчитать и собрать отчёты
        if: steps.check.outputs.found == 'yes'
        run: python engine/run.py

      - name: Показать итог в сводке запуска
        if: steps.check.outputs.found == 'yes'
        run: |
          DIR=$(ls -td 3_ОТЧЁТЫ/*/ | head -1)
          {
            echo "## Расчёт выполнен"
            echo ""
            echo '```'
            tail -20 "${DIR}журнал.txt"
            echo '```'
            echo ""
            echo "Отчёты лежат в \`${DIR}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить отчёты и дашборд в репозиторий
        if: steps.check.outputs.found == 'yes'
        run: |
          git config user.name  "Категорийная аналитика"
          git config user.email "actions@github.com"
          git add 3_ОТЧЁТЫ docs база
          git add -A 1_ВХОД
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Отчёты за $(date +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Приложить обработанные исходники к запуску
        if: steps.check.outputs.found == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: Исходники-обработанные
          path: 2_АРХИВ/
          retention-days: 90
          if-no-files-found: ignore

      - name: Приложить отчёты к запуску
        if: steps.check.outputs.found == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: Отчёты
          path: 3_ОТЧЁТЫ/
          retention-days: 90
          if-no-files-found: ignore
