# ============================================================================
#  НАСТРОЙКИ КАТЕГОРИЙНОЙ АНАЛИТИКИ РТГ
#  Это обычный текстовый файл. Правится в Блокноте или прямо на сайте GitHub
#  (открыть файл -> карандаш -> изменить -> Commit changes).
#  Меняйте только числа справа от двоеточия. Отступы менять нельзя.
# ============================================================================

экономика:
  # Стоимость владения запасом, доля в год. Из модели юнит-экономики дивизиона:
  # хранение 34,6 % + стоимость капитала 22 % = 56,6 %
  ставка_хранения: 0.346
  ставка_капитала: 0.220
  # Порог GMROI. Если не указан, берётся сумма двух ставок выше.
  # Категория с GMROI ниже порога не окупает собственное хранение.
  порог_gmroi: null
  # GMROI, выше которого категория считается отличной (зелёная подсветка)
  порог_gmroi_хороший: 1.5
  # Если запаса хватает меньше чем на столько дней, товар фактически
  # транзитный: он не лежит на складе, а проезжает через него. GMROI для
  # такого товара не считается - метрика измеряет отдачу на вложенный
  # в запас рубль, а вложения по сути нет. Иначе получаются GMROI в сотни.
  транзит_до_дней: 15

  # Норма покрытия запасом, дней (из юнит-экономики)
  норма_покрытия_дней: 120

дефицит:
  # Считать ли дефицит вообще. Нормы заданы только для складских позиций
  # (у нас это ~11 % ассортимента), поэтому OOS описывает не весь портфель.
  # Поставьте false, чтобы убрать разделы OOS из всех отчётов.
  включён: true

  # Считать дефицит только начиная с месяца, когда SKU впервые появился
  # (первый ненулевой сток или первая продажа). Без этого нормы, заданные
  # на весь год, создают "мнимый" дефицит за месяцы до ввода позиции
  # в ассортимент - и завышают OOS сильнее в начале года, чем в конце.
  учитывать_с_появления_sku: true
  # Доля покупателей, которые вернутся за товаром после отказа.
  # Используется в формуле Lost_sales = DNS x цена x коэффициент.
  # 0.3 - консервативная оценка по методике. 1.0 - верхняя граница потерь.
  коэффициент_возврата_покупателя: 0.3
  # Сколько последних месяцев брать для расчёта среднесуточного спроса
  окно_спроса_месяцев: 3

запас:
  # Границы возрастных корзин запаса, дней
  корзины_возраста: [30, 90, 180, 365]
  # Позиции моложе этого возраста НЕ попадают в список "вывести":
  # товар, приехавший неделю назад, ещё не успел продаться.
  # Они выносятся в отдельный список "новинки без старта продаж".
  новинка_до_дней: 90
  # Вычитать резерв из запаса при расчёте доступного запаса и оборачиваемости.
  # Резерв физически лежит на складе, но продать его нельзя.
  вычитать_резерв: true
  # Запас дороже скольки дней считается медленным
  медленный_от_дней: 180
  # Уценивать позиции старше скольки дней
  уценка_от_дней: 180
  # Узлы с запасом меньше этой суммы не получают относительных метрик:
  # на копеечном запасе GMROI и рентабельность бессмысленны
  порог_существенности_руб: 10000

сегментация:
  # Границы ABC по накопленной доле оборота
  abc_границы: [0.80, 0.95]
  # Границы XYZ по коэффициенту вариации месячных продаж
  xyz_границы: [0.5, 1.0]

кандидаты_на_развитие:
  # SKU попадает в список "развивать", если выполняются все условия
  классы_abc: ["A", "B"]
  минимальный_oos_процент: 30
  минимальная_маржа_процент: 20

проверки_качества:
  # Продажа считается "по символической цене", если оборот меньше этой доли
  # от себестоимости при себестоимости выше порога. Такие строки искажают маржу.
  символическая_цена_доля_оборота: 0.2
  символическая_цена_мин_себестоимость: 1000

источники:
  # Откуда брать актуальный статус SKU (складское/заказное).
  # "матрица" - из рабочей матрицы пополнения (актуальные решения),
  # "каталог" - из сквозной аналитики (может отставать).
  статус_sku_из: матрица
  # Использовать готовые решения и затраты из выгрузки юнит-экономики
  использовать_юнит_экономику: true

сравнение:
  # Сравнивать с предыдущим расчётом и показывать, что изменилось
  включено: true
  # Изменение запаса меньше этой суммы не считается значимым, руб
  порог_значимости_руб: 50000

уведомления:
  # Telegram: создайте бота через @BotFather, получите токен,
  # напишите боту любое сообщение и узнайте свой chat_id.
  # Оставьте null, чтобы не отправлять.
  telegram_токен: null
  telegram_chat_id: null

план_задач:
  # Задача попадает в план, только если она действительно нужна, выполнима
  # и окупает усилие. Ниже - пороги отсечки.

  # Уценка имеет смысл только для того, что ДЕЙСТВИТЕЛЬНО залежалось.
  # "Много дней запаса" и "лежит давно" - разные вещи: крупная партия,
  # приехавшая вчера, даёт огромный запас в днях, но уценивать её нечего.
  уценка_от_возраста_дней: 90

  # Свежий товар с избыточным запасом - это не уценка, а вопрос к размеру
  # партии. Такие позиции идут отдельным действием "Пересмотреть закупку".
  пересмотр_закупки_от_дней_запаса: 180

  # Минимальные суммы: ниже них действие дороже результата.
  # Перемещение коробки за 6 руб между городами - чистый убыток.
  минимум_уценка_руб: 3000
  минимум_перемещение_руб: 3000
  минимум_вывод_руб: 1000
  минимум_дозаказ_руб: 3000
  минимум_пересмотр_руб: 20000

  # Всё, что дешевле порога, не выбрасывается, а сворачивается в одну
  # строку "списать мелочью" с общей суммой.
  группировать_мелочь: true

  # Сколько партий при нулевых продажах считать признаком того, что
  # автозаказ продолжает докупать непродающуюся позицию.
  повторные_закупки_от_партий: 3

  # Сколько задач оставить в плане. Остальное доступно в детальных листах.
  # 2000 задач - это не план, а список; человек его не выполнит.
  максимум_задач: 300

планирование:
  # Сроки для листа "Задачи": сколько дней даётся на каждый тип действия
  срок_уценка_дней: 14
  срок_перемещение_дней: 7
  срок_дозаказ_дней: 5
  срок_вывод_дней: 30
  # Владельцы по умолчанию (подставляются в лист задач)
  владелец_уценка: "Категорийный менеджер"
  владелец_перемещение: "Логистика"
  владелец_дозаказ: "Закупки"
  владелец_вывод: "Категорийный менеджер"

периметр:
  # Чей периметр считаем. Имя должно совпадать с листом "Матрицы"
  # в файле сквозной аналитики, блок "Матрица_категорийных_менеджеров".
  # Если указать null, периметр берётся из файла config/scope.json
  категорийный_менеджер: null
  # Использовать готовый список из scope.json (рекомендуется)
  использовать_scope_json: true

отчёты:
  # Что генерировать при каждом запуске
  word: true
  excel: true
  дашборд: true
  # Сколько строк показывать в таблицах дашборда
  строк_в_дашборде: 400
  # Сколько SKU выгружать в дашборд (в Excel попадают все)
  sku_в_дашборде: 1500

история:
  # Накапливать ежедневные срезы запаса. Через 2-3 недели это даёт
  # настоящий дневной OOS вместо помесячной оценки. Выключать не рекомендуется.
  накапливать: true
  # Сколько дней хранить историю
  хранить_дней: 730
